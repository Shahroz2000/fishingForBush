<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💝</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Floating Background Elements -->
    <div class="floating-elements"></div>

    <!-- Main Content -->
    <div class="container">
        <h1 id="valentineTitle"></h1>

        <!-- Music Player -->
        <div id="musicControls" class="music-controls">
            <button id="musicToggle" class="music-btn">🎵 Play Music</button>
            <audio id="bgMusic" loop>
                <source id="musicSource" type="audio/mpeg">
            </audio>
        </div>

        <!-- Question 1 -->
        <div class="question-section" id="question1">
            <h2 id="question1Text"></h2>

            <!-- YES -->
            <button
                class="cute-btn"
                id="yesBtn1"
                onclick="handleYesClick(2)">
            </button>

            <!-- NO -->
            <button
                class="cute-btn"
                id="noBtn1"
                onclick="handleNoClick(this, document.getElementById('yesBtn1'))">
            </button>

            <!-- Secret (cosmetic only) -->
            <div class="secret-answer">
                <button
                    class="cute-btn special"
                    id="secretAnswerBtn"
                    onclick="showSecretMessage()">
                </button>
            </div>
        </div>

        <!-- Question 2 (Love Meter) -->
        <div class="question-section hidden" id="question2">
            <h2 id="question2Text"></h2>

            <div class="love-meter">
                <input
                    type="range"
                    min="0"
                    max="10000"
                    value="100"
                    class="slider"
                    id="loveMeter">

                <p>
                    <span class="love-value-container">
                        <span id="startText"></span>
                        (<span id="loveValue">100</span>%)
                    </span>
                    <span id="extraLove" class="hidden"></span>
                </p>
            </div>

            <button
                class="cute-btn"
                id="nextBtn"
                onclick="showNextQuestion(3)">
            </button>
        </div>

        <!-- Question 3 -->
        <div class="question-section hidden" id="question3">
            <h2 id="question3Text"></h2>

            <!-- FINAL YES -->
            <button
                class="cute-btn final-yes"
                id="yesBtn3"
                onclick="celebrate()">
            </button>

            <!-- FINAL NO (still runs away 😈) -->
            <button
                class="cute-btn"
                id="noBtn3"
                onclick="handleNoClick(this, document.getElementById('yesBtn3'))">
            </button>
        </div>

        <!-- Celebration -->
        <div class="celebration hidden" id="celebration">
            <h2 id="celebrationTitle"></h2>
            <p class="celebration-text" id="celebrationMessage"></p>
            <p class="celebration-text" id="celebrationEmojis"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="theme.js"></script>
    <script src="script.js"></script>

</body>
</html>
